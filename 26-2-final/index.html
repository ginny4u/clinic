:root[data-theme="dark"] {

var CLINIC_API_URL = 'https://script.google.com/macros/s/AKfycbxN_zUg62UVzI-xkiB_-CxSnZND29jsOmX6yDW-QLcFYvlQlh3QnpAGBCkDG11Zqik-_A/exec';

<script>
/* ===== 클리닉 점검표 공통 로직 (Apps Script와 미리보기에서 똑같이 사용) ===== */
var CORE_VERSION = 1;

function normName(s) { return String(s || '').replace(/\s+/g, '').trim(); }

function coreHandle(req, store, env) {
  try {
    var a = req && req.action;
    if (!a) return fail('요청이 비어 있습니다.');
    var fn = CORE_ACTIONS[a];
    if (!fn) return fail('알 수 없는 요청입니다: ' + a);
    var res = fn(req, store, env);
    // 선생님 화면: 저장 직후 최신 데이터를 같이 돌려줘서 다시 불러오는 왕복을 줄임
    if (res && res.ok && ADMIN_WRITES[a]) res.all = CORE_ACTIONS.adminAll({ token: req.token }, store, env);
    // 학생 화면: 로그인·비밀번호 변경 직후 홈 데이터를 같이 돌려줌
    if (res && res.ok && (a === 'login' || a === 'changePw') && res.me && !res.me.mustChange) res.home = CORE_ACTIONS.home({ token: res.token || req.token }, store, env);
    return res;
  } catch (e) {
    return fail(e && e.userMessage ? e.userMessage : ('서버 오류가 났습니다: ' + (e && e.message ? e.message : e)));
  }
}

function fail(msg) { return { ok: false, error: msg }; }
function userErr(msg) { var e = new Error(msg); e.userMessage = msg; return e; }

function pwHash(env, id, pw) { return env.hash('clinic:' + id + ':' + pw); }

function labelFor(st, all) {
  var same = all.filter(function (s) { return s.status === 'active' && normName(s.name) === normName(st.name); });
  if (same.length <= 1) return st.name;
  var sameSchool = same.filter(function (s) { return s.school === st.school; });
  return st.name + '(' + st.school + ')' + (sameSchool.length > 1 ? ' ' + st.id : '');
}

function publicStudent(s) {
  return { id: s.id, school: s.school, name: s.name, status: s.status, mustChange: !!s.mustChange, joinedAt: s.joinedAt };
}

function requireStudent(req, store, env) {
  var id = req.token && env.cacheGet('t:' + req.token);
  if (!id) throw userErr('로그인 시간이 지났습니다. 다시 로그인해 주세요.');
  var st = store.students().filter(function (s) { return s.id === id; })[0];
  if (!st || st.status !== 'active') throw userErr('등록된 학생이 아닙니다. 선생님께 말씀 드리세요.');
  return st;
}

function requireAdmin(req, store, env) {
  var ok = req.token && env.cacheGet('a:' + req.token);
  if (!ok) throw userErr('선생님 로그인이 필요해요. 다시 로그인해 주세요.');
  return true;
}

function lockCheck(env, key) {
  var n = Number(env.cacheGet('fail:' + key) || 0);
  if (n >= 5) throw userErr('비밀번호를 5번 틀려서 잠겼습니다. 10분 뒤에 다시 시도해 주세요.');
  return n;
}
function lockBump(env, key, n) { env.cachePut('fail:' + key, String(n + 1), 600); }

function itemsMap(store) {
  var m = {};
  store.allItems().forEach(function (r) { m[r.setId] = r.items; });
  return m;
}

function cleanMarks(obj, n, allowed) {
  var out = {};
  if (!obj || typeof obj !== 'object') return out;
  Object.keys(obj).forEach(function (k) {
    var no = Number(k), v = obj[k];
    if (no >= 1 && no <= n && allowed.indexOf(v) >= 0) out[no] = v;
  });
  return out;
}

var ADMIN_WRITES = { addStudents: 1, updateStudent: 1, saveSet: 1, setOpen: 1, deleteSet: 1 };

var CORE_ACTIONS = {
  /* ---------- 학생 ---------- */
  lookup: function (req, store) {
    var q = normName(req.name);
    if (!q) return fail('이름을 입력해 주세요.');
    var all = store.students();
    var hits = all.filter(function (s) { return s.status === 'active' && normName(s.name) === q; });
    if (!hits.length) return fail('명단에 없는 이름입니다. 오타가 없는지 확인하고, 그래도 안 되면 선생님께 말씀 드리세요.');
    return { ok: true, matches: hits.map(function (s) { return { id: s.id, label: labelFor(s, all) }; }) };
  },

  login: function (req, store, env) {
    var st = store.students().filter(function (s) { return s.id === req.id; })[0];
    if (!st || st.status !== 'active') return fail('등록된 학생이 아닙니다.');
    var n = lockCheck(env, st.id);
    if (pwHash(env, st.id, String(req.pw || '')) !== st.pwHash) {
      lockBump(env, st.id, n);
      return fail('비밀번호가 틀렸습니다. (' + (n + 1) + '/5)');
    }
    env.cacheRemove('fail:' + st.id);
    var token = env.uuid();
    env.cachePut('t:' + token, st.id, 21600);
    return { ok: true, token: token, me: publicStudent(st) };
  },

  changePw: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var pw = String(req.newPw || '');
    if (!/^\d{4}$/.test(pw)) return fail('비밀번호는 숫자 4자리로 정해 주세요.');
    if (pw === '0000') return fail('0000은 쓸 수 없습니다. 다른 번호로 정해 주세요.');
    st.pwHash = pwHash(env, st.id, pw);
    st.mustChange = false;
    store.putStudent(st);
    return { ok: true, me: publicStudent(st) };
  },

  home: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var sets = store.sets().filter(function (s) { return s.school === st.school; });
    var im = itemsMap(store);
    var mySubs = store.subs().filter(function (s) { return s.studentId === st.id; });
    var bySet = {};
    mySubs.forEach(function (s) { bySet[s.setId] = s; });
    var outSets = sets.map(function (s) {
      var sub = bySet[s.id];
      var n = (im[s.id] || []).length;
      var wrong = sub ? Object.keys(sub.marks).filter(function (k) { return sub.marks[k] === 'X'; }).length : 0;
      return { id: s.id, week: s.week, title: s.title, open: !!s.open, createdAt: s.createdAt, total: n,
        submitted: !!sub, score: sub ? n - wrong : null };
    }).sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
    var history = mySubs.map(function (s) {
      return { setId: s.setId, marks: s.marks, submittedAt: s.submittedAt };
    });
    var items = {};
    mySubs.forEach(function (s) { items[s.setId] = im[s.setId] || []; });
    // 같은 학교 재원생 기준 등수와 반 평균
    var mates = {}; store.students().forEach(function (s) { if (s.status === 'active' && s.school === st.school) mates[s.id] = 1; });
    var setIds = {}; sets.forEach(function (s) { setIds[s.id] = 1; });
    var bySetScores = {}, totals = {}, classType = {};
    store.subs().forEach(function (sb) {
      if (!mates[sb.studentId] || !setIds[sb.setId]) return;
      var its = im[sb.setId] || [], n = its.length;
      var x = Object.keys(sb.marks).filter(function (k) { return sb.marks[k] === 'X'; }).length;
      (bySetScores[sb.setId] || (bySetScores[sb.setId] = [])).push({ id: sb.studentId, v: n ? (n - x) / n : 0 });
      var t = totals[sb.studentId] || (totals[sb.studentId] = { n: 0, ok: 0 }); t.n += n; t.ok += n - x;
      its.forEach(function (it) {
        var m = sb.marks[it.no], miss = m === 'X' || m === 'G' ? 1 : 0;
        it.types.forEach(function (ty) { var b = classType[ty] || (classType[ty] = { n: 0, miss: 0 }); b.n++; b.miss += miss; });
      });
    });
    function rankOf(list, id) {
      var me = list.filter(function (o) { return o.id === id; })[0]; if (!me) return null;
      return { rank: 1 + list.filter(function (o) { return o.v > me.v + 1e-9; }).length, of: list.length };
    }
    var setRanks = {}; Object.keys(bySetScores).forEach(function (k) { setRanks[k] = rankOf(bySetScores[k], st.id); });
    var overallList = Object.keys(totals).map(function (id) { return { id: id, v: totals[id].n ? totals[id].ok / totals[id].n : 0 }; });
    var classRates = {}; Object.keys(classType).forEach(function (k) { classRates[k] = classType[k].n ? classType[k].miss / classType[k].n : 0; });
    return { ok: true, me: publicStudent(st), sets: outSets, history: history, items: items,
      ranks: { sets: setRanks, overall: rankOf(overallList, st.id), mates: Object.keys(mates).length }, classRates: classRates };
  },

  getSet: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var set = store.sets().filter(function (s) { return s.id === req.setId; })[0];
    if (!set || set.school !== st.school) return fail('클리닉을 잘못 선택하셨습니다.');
    var items = itemsMap(store)[set.id] || [];
    var sub = store.subs().filter(function (s) { return s.setId === set.id && s.studentId === st.id; })[0] || null;
    var check = store.checks().filter(function (c) { return c.setId === set.id && c.studentId === st.id; })[0] || null;
    return { ok: true, set: set, items: items, sub: sub, check: check ? { grades: check.grades, checkedAt: check.checkedAt } : null };
  },

  submit: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var set = store.sets().filter(function (s) { return s.id === req.setId; })[0];
    if (!set || set.school !== st.school) return fail('클리닉을 잘못 선택하셨습니다.');
    if (!set.open) return fail('주차가 마감된 클리닉입니다. 선생님께 말씀 드리세요.');
    var items = itemsMap(store)[set.id] || [];
    var n = items.length;
    var marks = cleanMarks(req.marks, n, ['X', 'G']);
    var follow = cleanMarks(req.follow, n, ['U', 'Q']);
    Object.keys(follow).forEach(function (k) { if (!marks[k]) delete follow[k]; });
    var hw = {};
    (set.homework || []).forEach(function (h) {
      var v = req.homework && req.homework[h];
      if (['done', 'part', 'none'].indexOf(v) >= 0) hw[h] = v;
    });
    var achieve = ['상', '중', '하'].indexOf(req.achieve) >= 0 ? req.achieve : '';
    var sub = { setId: set.id, studentId: st.id, submittedAt: env.now(), marks: marks, follow: follow,
      homework: hw, achieve: achieve, message: String(req.message || '').slice(0, 1000) };
    store.putSub(sub);
    var wrong = Object.keys(marks).filter(function (k) { return marks[k] === 'X'; }).length;
    return { ok: true, score: n - wrong, total: n };
  },

  /* ---------- 선생님 ---------- */
  adminLogin: function (req, store, env) {
    var n = lockCheck(env, 'admin');
    if (!env.adminPassword || String(req.pw || '') !== env.adminPassword) {
      lockBump(env, 'admin', n);
      return fail('비밀번호가 맞지 않아요. (' + (n + 1) + '/5)');
    }
    env.cacheRemove('fail:admin');
    var token = env.uuid();
    env.cachePut('a:' + token, '1', 21600);
    return { ok: true, token: token };
  },

  adminAll: function (req, store, env) {
    requireAdmin(req, store, env);
    return { ok: true, students: store.students().map(publicStudent), sets: store.sets(),
      items: itemsMap(store), subs: store.subs(), checks: store.checks() };
  },

  addStudents: function (req, store, env) {
    requireAdmin(req, store, env);
    var list = Array.isArray(req.list) ? req.list : [];
    var all = store.students();
    var added = [], skipped = [], fresh = [];
    var maxNo = all.reduce(function (m, s) { var k = Number(String(s.id).replace(/\D/g, '')) || 0; return Math.max(m, k); }, 0);
    list.forEach(function (r) {
      var school = String(r.school || '').trim(), name = String(r.name || '').trim();
      if (!school || !name) return;
      var dup = all.filter(function (s) { return s.school === school && normName(s.name) === normName(name); })[0];
      if (dup) {
        if (dup.status !== 'active') { dup.status = 'active'; store.putStudent(dup); added.push(name + '(' + school + ', 복귀)'); }
        else skipped.push(name + '(' + school + ')');
        return;
      }
      maxNo += 1;
      var id = 'S' + ('000' + maxNo).slice(-4);
      var st = { id: id, school: school, name: name, pwHash: pwHash(env, id, '0000'), mustChange: true,
        status: 'active', joinedAt: env.now() };
      fresh.push(st); all = all.concat([st]); added.push(name + '(' + school + ')');
    });
    if (fresh.length) {
      if (store.insertStudents) store.insertStudents(fresh);
      else fresh.forEach(function (st) { store.putStudent(st); });
    }
    return { ok: true, added: added, skipped: skipped };
  },

  updateStudent: function (req, store, env) {
    requireAdmin(req, store, env);
    var st = store.students().filter(function (s) { return s.id === req.id; })[0];
    if (!st) return fail('학생을 찾을 수 없어요.');
    if (req.op === 'reset') { st.pwHash = pwHash(env, st.id, '0000'); st.mustChange = true; env.cacheRemove('fail:' + st.id); }
    else if (req.op === 'leave') st.status = 'left';
    else if (req.op === 'return') st.status = 'active';
    else if (req.op === 'edit') {
      if (req.name) st.name = String(req.name).trim();
      if (req.school) st.school = String(req.school).trim();
    } else return fail('알 수 없는 작업이에요.');
    store.putStudent(st);
    return { ok: true, student: publicStudent(st) };
  },

  saveSet: function (req, store, env) {
    requireAdmin(req, store, env);
    var s = req.set || {};
    if (!s.school || !s.week) return fail('학교와 주차를 입력해 주세요.');
    var items = (Array.isArray(req.items) ? req.items : []).map(function (it, i) {
      return { no: i + 1, work: String(it.work || '').trim(), area: String(it.area || '').trim(),
        types: (Array.isArray(it.types) ? it.types : []).filter(Boolean).slice(0, 2), essay: !!it.essay };
    });
    if (!items.length) return fail('문항이 하나도 없어요.');
    var old = s.id && store.sets().filter(function (x) { return x.id === s.id; })[0];
    var set = { id: old ? old.id : 'C' + env.uuid().replace(/-/g, '').slice(0, 10), school: String(s.school).trim(),
      week: String(s.week).trim(), title: String(s.title || (s.school + ' ' + s.week)).trim(),
      homework: (Array.isArray(s.homework) ? s.homework : []).map(function (h) { return String(h).trim(); }).filter(Boolean),
      open: s.open === undefined ? true : !!s.open, createdAt: old ? old.createdAt : env.now(), note: old ? (old.note || '') : '' };
    store.putSet(set);
    store.putItems(set.id, items);
    return { ok: true, set: set };
  },

  saveChecks: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.setId; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    var ids = {}; store.students().forEach(function (s) { ids[s.id] = 1; });
    var saved = [];
    (Array.isArray(req.list) ? req.list : []).forEach(function (r) {
      if (!ids[r.studentId]) return;
      var g = {};
      (set.homework || []).forEach(function (h) { var v = r.grades && r.grades[h]; if (['A', 'B', 'F'].indexOf(v) >= 0) g[h] = v; });
      var c = { setId: set.id, studentId: r.studentId, checkedAt: env.now(), grades: g, extra: String(r.extra || '').slice(0, 200) };
      store.putCheck(c); saved.push(c);
    });
    return { ok: true, saved: saved };
  },

  saveNote: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.setId; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    set.note = String(req.note || '').slice(0, 1500); store.putSet(set);
    return { ok: true };
  },

  setOpen: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.id; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    set.open = !!req.open; store.putSet(set);
    return { ok: true, set: set };
  },

  deleteSet: function (req, store, env) {
    requireAdmin(req, store, env);
    store.deleteSet(req.id);
    return { ok: true };
  }
};

/* ---------- 통계 ---------- */
function calc(entries) {
  var type = {}, work = {}, area = {}, total = { n: 0, x: 0, g: 0 };
  entries.forEach(function (e) {
    (e.items || []).forEach(function (it) {
      var m = e.marks[it.no];
      var x = m === 'X' ? 1 : 0, g = m === 'G' ? 1 : 0;
      function add(bucket, key) { var b = bucket[key] || (bucket[key] = { n: 0, x: 0, g: 0 }); b.n++; b.x += x; b.g += g; }
      it.types.forEach(function (t) { add(type, t); });
      if (it.work) add(work, it.work);
      if (it.area) add(area, it.area);
      total.n++; total.x += x; total.g += g;
    });
  });
  return { type: type, work: work, area: area, total: total };
}
function rate(b) { return b && b.n ? (b.x + b.g) / b.n : 0; }

  return Object.keys(bucket).map(function (k) { return { key: k, b: bucket[k], r: rate(bucket[k]) }; })
    .filter(function (o) { return o.b.n >= (minN || 1); })
    .sort(function (a, b) { return b.r - a.r; });
}
function barRow(label, b, sub) {
  var r = rate(b), few = b.n < 5;
  return '<div class="bar' + (few ? ' few' : '') + '"><div class="bar-l"><span>' + h(label) + '</span>' + (sub ? '<small>' + h(sub) + '</small>' : '') +
    '</div><div class="bar-t"><i style="width:' + Math.max(2, r * 100) + '%"></i></div><div class="bar-v">' + pct(r) +
    '<small>' + (b.x + b.g) + '/' + b.n + '</small></div></div>';
}

  }
  var stt = $('#in-q') && root.querySelector('.t tbody');
  if (stt) stt.querySelectorAll('tr[data-name]').forEach(function (r) { r.hidden = !nameMatch(r.dataset.name, A.q); });
}
function refreshSms(school) {
  (A.todayRows || []).forEach(function (r, i) { if (!school || r.st.school === school) { var el = $('#sms-' + i); if (el) el.textContent = smsText(r); } });
}
function onInput(ev) {
  if (ev.target.dataset && ev.target.dataset.note !== undefined) {
    var sid = ev.target.dataset.note, set = A.data.setById[sid];
    if (set) { set.note = ev.target.value; refreshSms(); queueNoteSave(sid); var st = $('#note-st-' + sid); if (st) { st.textContent = ''; } }
    return;
  }
  if (/^in-(pw|new|new2)$/.test(ev.target.id)) { var v = ev.target.value.replace(/\D/g, '').slice(0, 4); if (v !== ev.target.value) ev.target.value = v; return; }
  if (ev.target.id === 'in-ckq') { A.ckQ = ev.target.value.trim(); applyFilter(); return; }
  if (ev.target.id === 'in-q') { A.q = ev.target.value.trim(); applyFilter(); return; }
}
/* 한글 입력 중(조합 중)인 마지막 글자가 빠지지 않게: 입력칸을 먼저 확정시킨 뒤 처리 */
function flushIme(ev, fn) {
  var ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae !== ev.target && ae.id !== 'in-ckq' && ae.id !== 'in-q') { ae.blur(); setTimeout(fn, 0); }
  else fn();
}
function onClickSafe(ev) { if (!ev.target.closest('[data-act]')) return; flushIme(ev, function () { onClick(ev); }); }
function onSubmitSafe(ev) {
  ev.preventDefault();
  var ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) { ae.blur(); setTimeout(function () { onSubmit(ev); }, 0); }
  else onSubmit(ev);
}
function onSubmit(ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.dataset.busy) return; // 엔터와 클릭이 겹쳐 두 번 보내지는 것 막기
  f.dataset.busy = '1';
  var sb = f.querySelector('button[type="submit"]');
  if (sb) { sb.disabled = true; sb.dataset.label = sb.textContent; sb.textContent = '확인 중…'; }
  if (f.id === 'f-name') { var nm = $('#in-name').value.trim(); if (!nm) { L.err = '이름을 입력해 주세요.'; return render(); } lookup(nm); }
  else if (f.id === 'f-pw') { var pw = $('#in-pw').value; if (!/^\d{4}$/.test(pw)) { L.err = '숫자 4자리를 입력해 주세요.'; return render(); } studentLogin(pw); }
  else if (f.id === 'f-change') {
    var a = $('#in-new').value, b = $('#in-new2').value;
    if (a !== b) { L.err = '두 번 입력한 비밀번호가 서로 다릅니다.'; return render(); }
    api('changePw', { token: S.token, newPw: a }).then(function (r) {
      if (!r.ok) { L.err = r.error; return render(); }
      L.err = ''; toast('비밀번호를 변경했습니다.'); if (r.home) { HOME = r.home; S.me = r.home.me; setView('home'); } else loadHome();
    });
  }
  else if (f.id === 'f-admin') adminLogin($('#in-apw').value);
  else if (f.id === 'f-sub') {
    keepMsg();
    F.err = '';
    api('submit', { token: S.token, setId: F.set.id, marks: F.marks, follow: F.follow }).then(function (r) {
      if (!r.ok) { F.err = r.error; return renderKeep(); }
      F.result = r; setView('done');
    });
  }
}
function afterRender() {
  applyFilter();
  if (S.view === 'admin' && A.tab === 'check' && !A.ckFocused) { A.ckFocused = true; var cq = $('#in-ckq'); if (cq && !('ontouchstart' in window)) cq.focus(); }
  var first = root.querySelector('#in-name, #in-pw, #in-new, #in-apw');
  if (first && !('ontouchstart' in window)) first.focus();
}

function boot() {
  root = document.getElementById('app');
  document.addEventListener('click', onClickSafe);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmitSafe);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && A.detail) { A.detail = null; render(); }
    if (e.target && e.target.id === 'in-ckq' && (e.key === 'Enter' || e.key === 'Escape') && !e.isComposing) { e.preventDefault(); A.ckQ = ''; e.target.value = ''; applyFilter(); }
  });
  if (S.token && S.role === 'student' && !IS_DEMO) loadHome();
  else if (S.token && S.role === 'admin' && !IS_DEMO) loadAdmin();
  else { S.token = null; S.role = null; render(); }
}
boot();

</script>
