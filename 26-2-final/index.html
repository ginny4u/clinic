<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내신 클리닉 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: 종이 점검표를 옮긴 한 장짜리 시트. 가는 선, 빨간 ♥ 하나, 숫자는 고정폭. */
:root {
  --paper: #f3f4f6; --sheet: #ffffff; --ink: #17181c; --muted: #5e6370; --line: #d6d9e0; --line-strong: #17181c;
  --accent: #b5402f; --accent-ink: #ffffff; --ok: #2c7350; --ok-bg: #e5f1ea; --warn: #9a6a0c; --warn-bg: #f8eed8; --bad: #b5402f; --bad-bg: #f8e4df;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-title: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111215; --sheet: #1a1c20; --ink: #eceef2; --muted: #9ba1ad; --line: #2f323a; --line-strong: #c9ccd3;
  --accent: #e2705d; --accent-ink: #1a0c09; --ok: #7fcaa2; --ok-bg: #1d2f25; --warn: #e6bb62; --warn-bg: #33291a; --bad: #ef8a78; --bad-bg: #3a201b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111215; --sheet: #1a1c20; --ink: #eceef2; --muted: #9ba1ad; --line: #2f323a; --line-strong: #c9ccd3;
  --accent: #e2705d; --accent-ink: #1a0c09; --ok: #7fcaa2; --ok-bg: #1d2f25; --warn: #e6bb62; --warn-bg: #33291a; --bad: #ef8a78; --bad-bg: #3a201b; color-scheme: dark; }

body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding: 0 16px; }
#app { padding-block: 16px 64px; }
main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
main.narrow { max-width: 440px; }
main.wide { max-width: 1120px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.05rem; margin-bottom: 6px; }
h2 small { font-family: var(--f-body); font-size: 0.8rem; color: var(--muted); margin-left: 6px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { text-align: center; padding-block: 18px 4px; }
.mast h1 { font-family: var(--f-title); font-size: clamp(1.7rem, 7vw, 2.3rem); }
.abar h1 { font-family: var(--f-title); }
.mascot { display: block; margin: 0 auto 6px; width: 170px; max-width: 60%; height: auto; }
.mascot.sm { width: 96px; }
.heart { color: var(--accent); }
.mast-sub { margin: 6px 0 0; color: var(--muted); }
.demo { max-width: 1120px; margin: 0 auto 8px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 6px; color: var(--muted); font-size: 0.9rem; background: var(--sheet); }

.sheet { background: var(--sheet); border: 1px solid var(--line-strong); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.block { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.two > * { min-width: 0; }
label { font-weight: 500; font-size: 0.92rem; }
input:not([type=checkbox]), select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 4px; }
input.short { width: 5.5em; }
textarea { resize: vertical; }
.hint, .note { margin: 0; color: var(--muted); font-size: 0.88rem; }
.err { margin: 0; color: var(--bad); font-weight: 500; }
.empty { margin: 0; color: var(--muted); }
.foot { text-align: center; }
.warnline { margin: 0; text-align: center; font-family: var(--f-display); font-size: 1.15rem; }

.btn { padding: 11px 18px; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 4px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.choice { text-align: left; font-size: 1.05rem; }
.btn:hover { border-color: var(--accent); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 0.92rem; }
.mini { border: 1px solid var(--line); background: var(--sheet); border-radius: 3px; padding: 4px 8px; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
.mini.arm { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.inline { display: inline-flex; gap: 8px; align-items: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--sheet); border: 1px solid var(--line-strong); cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.static { cursor: default; }
.card.static:hover { border-color: var(--line-strong); }
.zerobox { border: 1px dashed var(--line-strong); padding: 12px 14px; border-radius: 4px; }
.zerobox .chips label.chip { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.zerobox .chips input { width: auto; }
.card strong { font-size: 1.05rem; }
.card-k { font-family: var(--f-display); color: var(--accent); font-size: 1.1rem; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.82rem; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; width: fit-content; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.todo { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.75rem; border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; color: var(--muted); white-space: nowrap; }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 5em 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row.past { grid-template-columns: 4em 1fr auto; } .row.past > span:last-child, .nw { white-space: nowrap; }
.qrow { display: grid; grid-template-columns: 3.5em minmax(0, 9em) 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }

.bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 1.1fr) 4.6em; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.bar-l { min-width: 0; display: flex; flex-direction: column; }
.bar-l small { color: var(--muted); font-size: 0.76rem; }
.bar-t { height: 8px; background: var(--paper); border: 1px solid var(--line); }
.bar-t i { display: block; height: 100%; background: var(--accent); }
.bar-v { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 0.9rem; display: flex; flex-direction: column; line-height: 1.2; }
.bar-v small { color: var(--muted); font-size: 0.72rem; }
.bar.few { opacity: 0.55; }

.spark svg { width: 100%; max-width: 520px; height: auto; display: block; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark .line { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.spark .dot { fill: var(--accent); }
.spark .lbl { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.spark .val { fill: var(--ink); font-size: 10px; font-family: var(--f-num); }

.hw { display: flex; flex-direction: column; }
.hw-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-left: 1px solid var(--line); background: var(--sheet); padding: 7px 12px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button.on.done { background: var(--ink); color: var(--sheet); }
.seg button.on.part { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.seg button.on.none, .seg button.on.q { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; padding: 10px; }

.legend { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.k { width: 14px; height: 14px; border: 1px solid var(--line-strong); display: inline-block; }
.k.x { background: var(--accent); border-color: var(--accent); }
.k.g { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, var(--warn-bg) 3px 6px); border-color: var(--warn); }
.grid-no { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.no { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); background: var(--sheet); font-family: var(--f-num); font-size: 0.95rem; cursor: pointer; border-radius: 4px; }
.no.x { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.no.g { background: repeating-linear-gradient(135deg, var(--warn-bg) 0 6px, var(--sheet) 6px 12px); border: 2px solid var(--warn); color: var(--warn); font-weight: 600; }
.omr { display: flex; flex-direction: column; }
.orow { display: grid; grid-template-columns: 4.4em minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.orow-h { display: flex; flex-direction: column; line-height: 1.25; padding-top: 6px; }
.orow-h b { font-family: var(--f-num); font-size: 1.05rem; }
.orow-h small { color: var(--muted); font-size: 0.74rem; word-break: keep-all; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.op { height: 42px; border: 1px solid var(--line-strong); background: var(--sheet); color: var(--ink); border-radius: 999px; font-family: var(--f-num); font-size: 1rem; cursor: pointer; }
.op.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 700; }
.op.ess { border-radius: 4px; grid-column: span 2; font-family: var(--f-body); font-size: 0.92rem; }
.op.ess.x { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.orow.todo .orow-h b { color: var(--accent); }
.orow.blank { background: var(--warn-bg); box-shadow: -10px 0 0 var(--warn-bg), -14px 0 0 var(--warn), 10px 0 0 var(--warn-bg); }
.orow.blank .orow-h b { color: var(--warn); }
.subnote.blankask { color: var(--warn); font-weight: 600; }
.btn.warnbtn { background: var(--warn); border-color: var(--warn); color: var(--sheet); }
.mytag.blanktag { color: var(--warn); border-color: var(--warn); }
.tag.att { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); margin-left: 6px; font-weight: 600; }
.ckrow.att { box-shadow: inset 4px 0 0 var(--ok); }
.attbox { background: var(--sheet); border: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.attbox.ok { border-color: var(--ok); background: var(--ok-bg); }
.attbox.warn { border-color: var(--warn); background: var(--warn-bg); }
.attbox p { margin: 0; }
.obar { position: sticky; top: 0; z-index: 5; margin: 0 -18px; padding: 8px 18px; background: var(--sheet); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-strong);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.92rem; }
.obar-n { white-space: nowrap; } .obar b { font-size: 1.1rem; }
.ogrp { margin-top: 14px; padding: 8px 0 4px; border-bottom: 2px solid var(--line-strong); font-weight: 700; font-size: 1.02rem; }
.ogrp:first-child { margin-top: 0; }
.ogrp small { color: var(--muted); font-weight: 400; font-size: 0.86rem; }
.orow.flash { animation: oflash 2.6s ease-out; }
@keyframes oflash { 0%, 60% { background: var(--warn-bg); box-shadow: -10px 0 0 var(--warn-bg), -14px 0 0 var(--warn), 10px 0 0 var(--warn-bg); } 100% { background: transparent; box-shadow: none; } }
.res { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.res b { font-family: var(--f-num); }
.res .rw { color: var(--muted); font-size: 0.8rem; }
.res .ra { grid-column: 2; font-size: 0.95rem; }
.res .miss { color: var(--bad); font-weight: 700; }
.res .extra { color: var(--bad); text-decoration: line-through; }
.btn.primary.arm { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.subnote { margin: 4px 0 0; min-height: 2.8em; }
.good { color: var(--ok); font-weight: 600; margin: 6px 0; }
.subnote.armed { color: var(--accent); font-weight: 600; }
.mytag { font-size: 0.72rem; border: 1px solid var(--bad); color: var(--bad); padding: 0 5px; border-radius: 3px; margin-left: 6px; white-space: nowrap; }
.tally { display: flex; align-items: baseline; gap: 12px; justify-content: flex-end; border-top: 1px solid var(--line-strong); padding-top: 10px; flex-wrap: wrap; }
.tally strong { font-size: 1.5rem; }
.tally-g { color: var(--warn); font-weight: 600; }

.fl { display: flex; flex-direction: column; }
.fl-row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fl-no { font-family: var(--f-num); text-align: center; padding: 4px 0; border-radius: 3px; font-weight: 600; }
.fl-no.x { background: var(--accent); color: var(--accent-ink); }
.fl-no.g { border: 2px solid var(--warn); color: var(--warn); }
.fl-meta { display: flex; flex-direction: column; min-width: 0; }
.fl-meta small { color: var(--muted); }
.big { font-size: 3rem; text-align: center; font-family: var(--f-num); }
.big small { font-size: 1.2rem; color: var(--muted); }

.abar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line-strong); padding-bottom: 10px; }
.abar h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 8px; }
.abar h1 img { width: 44px; height: auto; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button.on { border-bottom-color: var(--accent); }
.abar-r { margin-left: auto; display: flex; gap: 14px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar select { width: auto; min-width: 200px; max-width: 100%; }
.toolbar input:not([type=checkbox]) { width: auto; flex: 1; min-width: 140px; max-width: 260px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line-strong); background: var(--sheet); }
.kpis > div { padding: 12px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.kpis > div:first-child { border-left: 0; }
.kpis span { color: var(--muted); font-size: 0.85rem; }
.kpis strong { font-size: 1.6rem; font-weight: 500; }
.kpis small { font-size: 0.9rem; color: var(--muted); }

.tscroll { overflow-x: auto; border: 1px solid var(--line); background: var(--sheet); }
.t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.t th { text-align: left; font-weight: 600; font-size: 0.8rem; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t .r { text-align: right; } .t .c { text-align: center; }
.t .muted, .muted { color: var(--muted); }
.t .msg { max-width: 22em; font-size: 0.85rem; }
.t tr.dim td { opacity: 0.5; }
.t tr.grp td { font-family: var(--f-display); font-size: 1rem; background: var(--paper); padding-top: 10px; }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.cellbar { position: relative; min-width: 110px; }
.cellbar i { position: absolute; left: 10px; top: 50%; height: 8px; transform: translateY(-50%); background: var(--accent); max-width: calc(100% - 64px); }
.cellbar span { position: relative; float: right; font-family: var(--f-num); font-size: 0.85rem; }
.heat-t td.heat { text-align: center; background: color-mix(in srgb, var(--accent) calc(var(--r) * 58%), transparent); min-width: 64px; }
.heat-t td.heat b { font-family: var(--f-num); font-weight: 500; display: block; }
.heat-t td.heat small { color: var(--muted); font-size: 0.7rem; font-family: var(--f-num); }
.heat-t td.few { opacity: 0.5; }
.heat-t td.empty-c { color: var(--muted); text-align: center; }
.hwstat { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.hwstat small { flex-basis: 100%; color: var(--muted); }
.badtxt { color: var(--bad); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; }
.edit-t input, .edit-t select { padding: 6px 8px; min-width: 120px; }
details summary { cursor: pointer; font-weight: 600; }
details { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow-y: auto; z-index: 10; }
.modal { background: var(--sheet); border: 1px solid var(--line-strong); max-width: 860px; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.busybar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; background: var(--accent); transform-origin: left; animation: busy 1.2s ease-in-out infinite; z-index: 30; }
@keyframes busy { 0% { transform: scaleX(0.05); opacity: 1; } 70% { transform: scaleX(0.85); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 4px; z-index: 20; font-size: 0.92rem; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: var(--accent-ink); }
@media (max-width: 520px) {
  .fl-row { grid-template-columns: 2.4em minmax(0, 1fr); }
  .fl-row .seg, .fl-row .qbtn { grid-column: 1 / -1; justify-self: end; }
  .qrow { grid-template-columns: 3.5em 1fr; } .qrow span:last-child { grid-column: 1 / -1; }
  .abar-r { margin-left: 0; }
}

.gradechips { display: flex; gap: 8px; flex-wrap: wrap; }
.gchip { display: inline-flex; flex-direction: column; align-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 4px; min-width: 64px; }
.gchip small { color: var(--muted); font-size: 0.78rem; }
.gchip b { font-family: var(--f-num); font-size: 1.2rem; }
.g-A b, .gmini.g-A { color: var(--ok); } .g-B b, .gmini.g-B { color: var(--warn); } .g-F b, .gmini.g-F { color: var(--bad); }
.gmini { display: inline-block; width: 1.4em; text-align: center; font-weight: 600; }
.cklist { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--sheet); }
.ckrow { display: grid; grid-template-columns: minmax(7em, 10em) 1fr; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.ck-name { display: flex; flex-direction: column; }
.ck-items { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.ck-item { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; }
.seg button.on.gA { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.seg button.on.gB { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.seg button.on.gF { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.dateinp { width: auto !important; }
.evalbox { background: var(--sheet); border: 1px solid var(--line); padding: 10px 14px; }
.evalbox summary small { font-weight: 400; margin-left: 6px; }
.evalgrid { display: grid; grid-template-columns: minmax(8em, max-content) minmax(0, 1fr); gap: 8px 12px; align-items: center; }
@media (max-width: 520px) { .evalgrid { grid-template-columns: 1fr; } }

var CORE_VERSION = 8;

}

// 세트를 먼저 만들고 명단을 나중에 넣어도(첫 제출 전이면) 그 주 인원으로 치고, 이미 제출이 시작된 뒤 들어온 신규생은 뺀다.

  var first = (subsOfSet || []).map(function (s) { return String(s.submittedAt || ''); }).filter(Boolean).sort()[0];

function setStats(store, set, items, meId, fresh, subsList) {
  var mates = {};

  var subs = (subsList || store.subs()).filter(function (s) { return s.setId === set.id && mates[s.studentId] && !(fresh && s.studentId === fresh.studentId); });

  lookup: function (req, store) {

      var wrong = sub ? Object.keys(sub.marks).filter(function (k) { return sub.marks[k] === 'X'; }).length : 0;

    var mates = {}; store.students().forEach(function (s) { if (s.status === 'active' && s.school === st.school) mates[s.id] = 1; });

      Object.keys(mates).forEach(function (id) { if (!done[id] && String(stuById[id].joinedAt) <= cut) list.push({ id: id, v: -1 }); });
      // 진행 중인 주는 min(5명, 그 학교 인원)이 낼 때까지 등수·누적에 넣지 않음
      if (openSet[set.id] && subsHere.length < Math.min(RANK_MIN, list.length)) { setRanks[set.id] = { few: true, count: subsHere.length }; return; }
      var r = rankOf(list, st.id);
      if (r) { if (!done[st.id]) { if (openSet[set.id]) r = { pending: true }; else r.absent = true; } setRanks[set.id] = r; }
      list.forEach(function (o) {
        if (o.v < 0 && openSet[set.id]) return;   // 진행 중인 주에 아직 안 낸 학생은 누적에 넣지 않음
        var w = weekly[o.id] || (weekly[o.id] = { n: 0, sum: 0 }); w.n++; w.sum += Math.max(0, o.v);
      });
    });
    var overallList = Object.keys(weekly).map(function (id) { return { id: id, v: weekly[id].sum / weekly[id].n }; });
    var classRates = {}; Object.keys(classType).forEach(function (k) { classRates[k] = classType[k].n ? classType[k].miss / classType[k].n : 0; });
    return { ok: true, me: publicStudent(st), sets: outSets, history: history, items: items,
      ranks: { sets: setRanks, overall: rankOf(overallList, st.id), mates: Object.keys(mates).length }, classRates: classRates };
  },

  getSet: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var set = store.sets().filter(function (s) { return s.id === req.setId; })[0];
    if (!set || set.school !== st.school) return fail('클리닉을 잘못 선택하셨습니다.');
    var items = itemsMap(store)[set.id] || [];
    var sub = store.subs().filter(function (s) { return s.setId === set.id && s.studentId === st.id; })[0] || null;
    var check = store.checks().filter(function (c) { return c.setId === set.id && c.studentId === st.id; })[0] || null;
    var result = null;
    if (sub) {
      var wrong0 = Object.keys(sub.marks).filter(function (k) { return sub.marks[k] === 'X'; }).length;
      result = { score: items.length - wrong0, total: items.length, pct: items.length ? subCredit(items, sub) / items.length : 0, partial: setPartial(items), stats: setStats(store, set, items, st.id) };
      if (setIsOmr(items)) result.detail = resultFor(items, sub);
    }
    return { ok: true, set: set, items: forStudent(items), sub: sub, result: result, check: check ? { grades: check.grades, checkedAt: check.checkedAt } : null };
  },

  submit: function (req, store, env) {
    var st = requireStudent(req, store, env);
    var set = store.sets().filter(function (s) { return s.id === req.setId; })[0];
    if (!set || set.school !== st.school) return fail('클리닉을 잘못 선택하셨습니다.');
    if (!set.open) return fail('주차가 마감된 클리닉입니다. 선생님께 말씀 드리세요.');
    var items = itemsMap(store)[set.id] || [];
    var n = items.length;
    if (!n) return fail('이번 주는 입력할 문항이 없는 클리닉이에요.');
    var omr = setIsOmr(items), marks, follow;
    if (omr) {
      var prev = store.subs().filter(function (s) { return s.setId === set.id && s.studentId === st.id; })[0];
      if (prev) { var f0 = fail('이미 제출한 클리닉이에요. 고칠 게 있으면 선생님께 말씀 드리세요.'); f0.already = true; return f0; }
      if (!req.picks || typeof req.picks !== 'object') return fail('화면이 예전 버전이에요. 새로고침한 뒤 다시 제출해 주세요.');
      var picks = req.picks, essayX = cleanMarks(req.marks, n, ['X']);
      marks = {}; follow = {};
      items.forEach(function (it) {
        if (isOmr(it)) {
          var p = cleanPicks(picks[it.no], Number(it.opts));
          follow['p' + it.no] = p.join(',');
          if (!samePicks(p, cleanPicks(it.ans, Number(it.opts)))) marks[it.no] = 'X';
        } else if (essayX[it.no]) marks[it.no] = 'X';
      });
    } else {
      marks = cleanMarks(req.marks, n, ['X', 'G']);
      follow = cleanMarks(req.follow, n, ['U', 'Q']);
      Object.keys(follow).forEach(function (k) { if (!marks[k]) delete follow[k]; });
    }
    var subsBefore = store.subs();
    var hw = {};
    (set.homework || []).forEach(function (h) {
      var v = req.homework && req.homework[h];
      if (['done', 'part', 'none'].indexOf(v) >= 0) hw[h] = v;
    });
    var achieve = ['상', '중', '하'].indexOf(req.achieve) >= 0 ? req.achieve : '';
    var sub = { setId: set.id, studentId: st.id, submittedAt: env.now(), marks: marks, follow: follow,
      homework: hw, achieve: achieve, message: String(req.message || '').slice(0, 1000) };
    store.putSub(sub);
    var wrong = Object.keys(marks).filter(function (k) { return marks[k] === 'X'; }).length;
    var res = { ok: true, score: n - wrong, total: n, pct: n ? subCredit(items, sub) / n : 0, partial: setPartial(items), stats: setStats(store, set, items, st.id, sub, subsBefore) };
    if (omr) res.detail = resultFor(items, sub);
    return res;
  },

  /* ---------- 선생님 ---------- */
  adminLogin: function (req, store, env) {
    var n = lockCheck(env, 'admin');
    if (!env.adminPassword || String(req.pw || '') !== env.adminPassword) {
      lockBump(env, 'admin', n);
      return fail('비밀번호가 맞지 않아요. (' + (n + 1) + '/5)');
    }
    env.cacheRemove('fail:admin');
    var token = env.uuid();
    env.cachePut('a:' + token, '1', 21600);
    return { ok: true, token: token };
  },

  adminAll: function (req, store, env) {
    requireAdmin(req, store, env);
    return { ok: true, students: store.students().map(publicStudent), sets: store.sets(),
      items: itemsMap(store), subs: store.subs(), checks: store.checks() };
  },

  addStudents: function (req, store, env) {
    requireAdmin(req, store, env);
    var list = Array.isArray(req.list) ? req.list : [];
    var all = store.students();
    var added = [], skipped = [], fresh = [];
    var maxNo = all.reduce(function (m, s) { var k = Number(String(s.id).replace(/\D/g, '')) || 0; return Math.max(m, k); }, 0);
    list.forEach(function (r) {
      var school = String(r.school || '').trim(), name = String(r.name || '').trim();
      if (!school || !name) return;
      var dup = all.filter(function (s) { return s.school === school && normName(s.name) === normName(name); })[0];
      if (dup) {
        if (dup.status !== 'active') { dup.status = 'active'; store.putStudent(dup); added.push(name + '(' + school + ', 복귀)'); }
        else skipped.push(name + '(' + school + ')');
        return;
      }
      maxNo += 1;
      var id = 'S' + ('000' + maxNo).slice(-4);
      var st = { id: id, school: school, name: name, pwHash: pwHash(env, id, '0000'), mustChange: true,
        status: 'active', joinedAt: env.now() };
      fresh.push(st); all = all.concat([st]); added.push(name + '(' + school + ')');
    });
    if (fresh.length) {
      if (store.insertStudents) store.insertStudents(fresh);
      else fresh.forEach(function (st) { store.putStudent(st); });
    }
    return { ok: true, added: added, skipped: skipped };
  },

  updateStudent: function (req, store, env) {
    requireAdmin(req, store, env);
    var st = store.students().filter(function (s) { return s.id === req.id; })[0];
    if (!st) return fail('학생을 찾을 수 없어요.');
    if (req.op === 'reset') { st.pwHash = pwHash(env, st.id, '0000'); st.mustChange = true; env.cacheRemove('fail:' + st.id); }
    else if (req.op === 'leave') st.status = 'left';
    else if (req.op === 'return') st.status = 'active';
    else if (req.op === 'edit') {
      if (req.name) st.name = String(req.name).trim();
      if (req.school) st.school = String(req.school).trim();
    } else return fail('알 수 없는 작업이에요.');
    store.putStudent(st);
    return { ok: true, student: publicStudent(st) };
  },

  saveSet: function (req, store, env) {
    requireAdmin(req, store, env);
    var s = req.set || {};
    if (!s.school || !s.week) return fail('학교와 주차를 입력해 주세요.');
    var items = (Array.isArray(req.items) ? req.items : []).map(function (it, i) {
      var o = { no: i + 1, work: String(it.work || '').trim(), area: String(it.area || '').trim(),
        types: (Array.isArray(it.types) ? it.types : []).filter(Boolean).slice(0, 2), essay: !!it.essay };
      var opts = Math.max(0, Math.min(20, Math.floor(Number(it.opts) || 0)));
      if (opts && !o.essay) { o.opts = opts; o.ans = cleanPicks(it.ans, 20); }
      return o;
    });
    // 문항이 없는 세트 = 학생이 입력할 것이 없는 주. 이미 낸 학생이 있는 세트는 문항을 모두 지울 수 없음
    var old0 = s.id && store.sets().filter(function (x) { return x.id === s.id; })[0];
    if (!items.length && old0 && store.subs().some(function (sb) { return sb.setId === old0.id; })) return fail('이미 제출한 학생이 있어서 문항을 모두 지울 수 없어요.');
    var omrSet = setIsOmr(items);
    var noAns = items.filter(function (it) {
      if (it.essay) return false;
      if (!it.opts) return omrSet;
      return !it.ans.length || it.ans.some(function (k) { return k > it.opts; });
    }).map(function (it) { return it.no; });
    if (noAns.length) return fail('선지 수나 정답이 맞지 않는 문항: ' + noAns.join(', ') + '번');
    var old = s.id && store.sets().filter(function (x) { return x.id === s.id; })[0];
    var oldItems = old ? (itemsMap(store)[old.id] || []) : [];
    if (old && setIsOmr(oldItems) && req.v !== 2) return fail('화면이 예전 버전이에요. 새로고침한 뒤 다시 저장해 주세요.');
    if (old && omrSet && oldItems.length !== items.length && store.subs().some(function (sb) { return sb.setId === old.id && hasPicks(sb); }))
      return fail('이미 무한선지로 제출한 학생이 있어서 문항 수를 바꿀 수 없어요. (지금 ' + oldItems.length + '문항)');
    if (old && omrSet && items.some(function (it, i) { return isOmr(it) !== isOmr(oldItems[i]); }) && store.subs().some(function (sb) { return sb.setId === old.id && hasPicks(sb); }))
      return fail('이미 무한선지로 제출한 학생이 있어서 문항을 서술형과 객관식 사이로 바꿀 수 없어요.');
    var set = { id: old ? old.id : 'C' + env.uuid().replace(/-/g, '').slice(0, 10), school: String(s.school).trim(),
      week: String(s.week).trim(), title: String(s.title || (s.school + ' ' + s.week)).trim(),
      homework: (Array.isArray(s.homework) ? s.homework : []).map(function (h) { return String(h).trim(); }).filter(Boolean),
      open: s.open === undefined ? true : !!s.open, createdAt: old ? old.createdAt : env.now(), note: old ? (old.note || '') : '', evalName: old ? (old.evalName || '') : '' };
    store.putSet(set);
    store.putItems(set.id, items);
    var regraded = 0, oldSubs = 0;
    if (old && omrSet) {
      store.subs().filter(function (sb) { return sb.setId === set.id; }).forEach(function (sb) {
        if (!hasPicks(sb)) { oldSubs++; return; }
        var nm = {};
        items.forEach(function (it) {
          if (isOmr(it)) { if (!samePicks(picksOf(sb, it.no), cleanPicks(it.ans, it.opts))) nm[it.no] = 'X'; }
          else if (sb.marks && sb.marks[it.no] === 'X') nm[it.no] = 'X';
        });
        if (JSON.stringify(nm) !== JSON.stringify(sb.marks || {})) { sb.marks = nm; store.putSub(sb); regraded++; }
      });
    }
    return { ok: true, set: set, regraded: regraded, oldSubs: oldSubs };
  },

  // 학생이 잘못 낸 주를 지워서 다시 낼 수 있게 함(숙제 검사·학생 계정은 그대로)
  resetSub: function (req, store, env) {
    requireAdmin(req, store, env);
    var sub = store.subs().filter(function (s) { return s.setId === req.setId && s.studentId === req.studentId; })[0];
    if (!sub) return fail('지울 제출 기록이 없어요. 새로고침해 보세요.');
    if (!store.deleteSub) return fail('서버가 아직 예전 버전이라 초기화할 수 없어요.');
    store.deleteSub(req.setId, req.studentId);
    return { ok: true };
  },

  // 선생님이 학생이 고른 번호를 고침(낸 시각은 그대로, 점수는 다시 매김)
  editSub: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.setId; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    var sub = store.subs().filter(function (s) { return s.setId === set.id && s.studentId === req.studentId; })[0];
    if (!sub) return fail('고칠 제출 기록이 없어요. 새로고침해 보세요.');
    var items = itemsMap(store)[set.id] || [];
    if (!setIsOmr(items) || !hasPicks(sub)) return fail('무한선지로 낸 기록만 고칠 수 있어요.');
    if (!req.picks || typeof req.picks !== 'object') return fail('고친 답이 비어 있어요.');
    var essayX = cleanMarks(req.marks, items.length, ['X']), marks = {}, follow = {};
    Object.keys(sub.follow || {}).forEach(function (k) { if (!/^p\d+$/.test(k)) follow[k] = sub.follow[k]; });
    items.forEach(function (it) {
      if (isOmr(it)) {
        var p = cleanPicks(req.picks[it.no], Number(it.opts));
        follow['p' + it.no] = p.join(',');
        if (!samePicks(p, cleanPicks(it.ans, Number(it.opts)))) marks[it.no] = 'X';
      } else if (essayX[it.no]) marks[it.no] = 'X';
    });
    var before = items.length - Object.keys(sub.marks || {}).filter(function (k) { return sub.marks[k] === 'X'; }).length;
    var pctBefore = subCredit(items, sub) / items.length;
    sub.marks = marks; sub.follow = follow;
    store.putSub(sub);
    return { ok: true, before: before, score: items.length - Object.keys(marks).length, total: items.length, pctBefore: pctBefore, pct: subCredit(items, sub) / items.length, partial: setPartial(items) };
  },

  saveChecks: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.setId; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    var ids = {}; store.students().forEach(function (s) { ids[s.id] = 1; });
    var saved = [];
    (Array.isArray(req.list) ? req.list : []).forEach(function (r) {
      if (!ids[r.studentId]) return;
      var g = {};
      (set.homework || []).forEach(function (h) { var v = r.grades && r.grades[h]; if (['A', 'B', 'F'].indexOf(v) >= 0) g[h] = v; });
      var c = { setId: set.id, studentId: r.studentId, checkedAt: env.now(), grades: g, extra: String(r.extra || '').slice(0, 200) };
      store.putCheck(c); saved.push(c);
    });
    return { ok: true, saved: saved };
  },

  saveNote: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.setId; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    if (req.note !== undefined) set.note = String(req.note || '').slice(0, 1500);
    if (req.evalName !== undefined) set.evalName = String(req.evalName || '').trim().slice(0, 60);
    store.putSet(set);
    return { ok: true };
  },

  setOpen: function (req, store, env) {
    requireAdmin(req, store, env);
    var set = store.sets().filter(function (x) { return x.id === req.id; })[0];
    if (!set) return fail('세트를 찾을 수 없어요.');
    set.open = !!req.open; store.putSet(set);
    return { ok: true, set: set };
  },

  deleteSet: function (req, store, env) {
    requireAdmin(req, store, env);
    store.deleteSet(req.id);
    return { ok: true };
  }
};

var pending = 0;

  busy(1);
  return apiRaw(action, payload).then(function (r) { busy(-1); return r; });
}
function apiRaw(action, payload) {
  var req = Object.assign({ action: action }, payload || {});
  if (IS_DEMO) return new Promise(function (res) { setTimeout(function () { res(demoCall(req)); }, 120); });
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : null;
  return fetch(CLINIC_API_URL, { method: 'POST', body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (x) { clearTimeout(tm); return x; })
    .catch(function (e) { clearTimeout(tm); return { ok: false, error: e && e.name === 'AbortError' ? '응답이 늦어요. 제출 버튼을 다시 눌러 주세요. 이미 제출됐다면 결과 화면으로 넘어가요.' : '서버에 연결되지 않습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.' }; });
}

function h(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

// 제출 결과(detail)에서 문항 점수 다시 계산(학생 결과 화면의 '많이 틀린 유형'용)
function creditFromDetail(detail) {
  var o = {};
  (detail || []).forEach(function (d) {
    if (!d.wrong) return;
    if (d.blank || !d.ans) { o[d.no] = 0; return; }
    var hit = d.picks.filter(function (k) { return d.ans.indexOf(k) >= 0; }).length;
    o[d.no] = hit / (d.ans.length + d.picks.length - hit);
  });
  return o;
}

/* ---------- 통계 ---------- */
function calc(entries) {
  var type = {}, work = {}, area = {}, total = { n: 0, x: 0, g: 0 };
  entries.forEach(function (e) {
    (e.items || []).forEach(function (it) {
      var m = e.marks[it.no];
      var x = m === 'X' ? (e.credit && e.credit[it.no] !== undefined ? 1 - e.credit[it.no] : 1) : 0, g = m === 'G' ? 1 : 0;
      function add(bucket, key) { var b = bucket[key] || (bucket[key] = { n: 0, x: 0, g: 0 }); b.n++; b.x += x; b.g += g; }
      if (!(e.skip && e.skip[it.no])) {
        it.types.forEach(function (t) { add(type, t); });
        if (it.work) add(work, it.work);
        if (it.area) add(area, it.area);
      }
      total.n++; total.x += x; total.g += g;
    });
  });
  return { type: type, work: work, area: area, total: total };
}
function toSkip(arr) { var o = {}; (arr || []).forEach(function (n) { o[n] = 1; }); return o; }
function rate(b) { return b && b.n ? (b.x + b.g) / b.n : 0; }
function sortedRates(bucket, minN) {
  return Object.keys(bucket).map(function (k) { return { key: k, b: bucket[k], r: rate(bucket[k]) }; })
    .filter(function (o) { return o.b.n >= (minN || 1); })
    .sort(function (a, b) { return b.r - a.r; });
}
function barRow(label, b, sub) {
  var r = rate(b), few = b.n < 5;
  return '<div class="bar' + (few ? ' few' : '') + '"><div class="bar-l"><span>' + h(label) + '</span>' + (sub ? '<small>' + h(sub) + '</small>' : '') +
    '</div><div class="bar-t"><i style="width:' + Math.max(2, r * 100) + '%"></i></div><div class="bar-v">' + pct(r) +
    '<small>' + fmtX(b.x + b.g) + '/' + b.n + '</small></div></div>';
}

function myBar(label, b, classRate, sub) {

  return '<div class="bar' + (few ? ' few' : '') + '"><div class="bar-l"><span>' + h(label) + '</span>' + (sub ? '<small>' + h(sub) + '</small>' : '') + diff + '</div>' +

function trend(entries) {
  // 주마다 시험 난이도가 달라서 점수 대신 같은 시험을 본 같은 학교 친구들 사이의 위치를 그림
  var setMeta = {}; HOME.sets.forEach(function (s) { setMeta[s.id] = s; });
  var rs = (HOME.ranks && HOME.ranks.sets) || {};
  var pts = HOME.sets.map(function (s) {
    var r = rs[s.id]; if (!r || !r.of) return null;
    return { t: s.createdAt || '', w: s.week || '', r: r, v: r.of > 1 ? 1 - (r.rank - 1) / (r.of - 1) : 1 };
  }).filter(Boolean).sort(function (a, b) { return a.t.localeCompare(b.t); });
  if (pts.length < 2) return '';
  var W = 320, H = 96, pad = 20;
  var xs = function (i) { return pad + i * (W - pad * 2) / (pts.length - 1); }, ys = function (v) { return H - 20 - v * (H - 38); };
  var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.v).toFixed(1); }).join(' ');
  return '<h3>주차별 우리 학교 안 등수</h3><p class="note">시험마다 난이도가 달라서 점수보다 같은 시험을 본 친구들 사이의 위치로 봐야 정확해요.</p>' +
    '<div class="spark"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="주차별 우리 학교 안 등수">' +
    '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + ys(1) + '" y2="' + ys(1) + '" class="grid"/><line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + ys(0) + '" y2="' + ys(0) + '" class="grid"/>' +
    '<path d="' + path + '" class="line"/>' + pts.map(function (p, i) {
      return '<circle cx="' + xs(i) + '" cy="' + ys(p.v) + '" r="' + (i === pts.length - 1 ? 4 : 2.5) + '" class="dot"/>' +
        '<text x="' + xs(i) + '" y="' + (H - 4) + '" text-anchor="middle" class="lbl">' + h(p.w) + '</text>' +
        '<text x="' + xs(i) + '" y="' + (ys(p.v) - 7) + '" text-anchor="middle" class="val">' + (p.r.absent ? '미제출' : rankShown(p.r) ? p.r.rank + '/' + p.r.of + '등' : '') + '</text>';
    }).join('') + '</svg></div>';
}

  });

  });
  if (gotAtt) A.tab = 'check';
  if (S.token && S.role === 'student' && !IS_DEMO) loadHome();
  else if (S.token && S.role === 'admin' && !IS_DEMO) loadAdmin();
  else { S.token = null; S.role = null; render(); }
